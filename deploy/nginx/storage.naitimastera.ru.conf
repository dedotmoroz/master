server {
    server_name storage.naitimastera.ru;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:59000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/storage.naitimastera.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.naitimastera.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name storage.naitimastera.ru;
    return 301 https://$host$request_uri;
}
