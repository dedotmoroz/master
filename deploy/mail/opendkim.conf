Syslog yes
SyslogSuccess yes
LogWhy no
UMask 007
UserID opendkim
Mode s
Canonicalization relaxed/simple
SignatureAlgorithm rsa-sha256
OversignHeaders From
Socket inet:8891@127.0.0.1
PidFile /run/opendkim/opendkim.pid
KeyTable file:/etc/opendkim/naitimastera/KeyTable
SigningTable refile:/etc/opendkim/naitimastera/SigningTable
InternalHosts file:/etc/opendkim/naitimastera/TrustedHosts
