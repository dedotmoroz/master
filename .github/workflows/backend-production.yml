name: Backend production

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - deploy/production.compose.yml
      - deploy/compose-command.sh
      - deploy/deploy-backend.sh
      - deploy/mail/mail.compose.yml
      - .github/workflows/backend-production.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: naitimastera-backend-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/naitimastera-backend

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test

      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=naitimastera-backend
          cache-to: type=gha,mode=max,scope=naitimastera-backend

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure pinned SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          EXPECTED_HOST_FINGERPRINT: SHA256:6ilZRDABhfuGqcZQYFRqhGyls3Z6nqlatSKrnK7gDQc
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$HOME/.ssh/known_hosts"
          actual_fingerprint=$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk 'NR == 1 { print $2 }')
          test "$actual_fingerprint" = "$EXPECTED_HOST_FINGERPRINT"

      - name: Upload production deploy files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -P "$SSH_PORT" -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            deploy/production.compose.yml deploy/deploy-backend.sh \
            deploy/compose-command.sh deploy/mail/mail.compose.yml \
            "$SSH_USER@$SSH_HOST:/srv/naitimastera/"

      - name: Migrate and deploy backend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote_user=$(printf '%q' "$GHCR_USER")
          printf '%s' "$GHCR_TOKEN" | ssh -p "$SSH_PORT" \
            -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash /srv/naitimastera/deploy-backend.sh $remote_user"
