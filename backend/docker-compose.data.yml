name: naitimastera-data
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: naitimastera
      POSTGRES_USER: naitimastera
      POSTGRES_PASSWORD: naitimastera_local
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naitimastera -d naitimastera"]
      interval: 1s
      timeout: 3s
      retries: 30
  storage:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - storage_data:/data
      - storage_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
  clamav:
    image: clamav/clamav-debian:1.5
    ports:
      - "127.0.0.1:53310:3310"
volumes:
  postgres_data:
  storage_data:
  storage_logs:
